<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>試験タイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EAF0F2; --ink:#1F3340; --muted:#6C8290; --track:#D3DEE3; --field:#FFFFFF;
  --p1:#E8A33D; --p2:#2E8C83; --btn:#1F3340; --btnink:#F4F8F9; --alarm:#D9534A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16232B; --ink:#E4EEF1; --muted:#8AA0AC; --track:#2A3B45; --field:#1E2E37;
    --p1:#F0B457; --p2:#4FB3A8; --btn:#E4EEF1; --btnink:#16232B; --alarm:#E8706A;
  }
}
:root[data-theme="dark"]{
  --bg:#16232B; --ink:#E4EEF1; --muted:#8AA0AC; --track:#2A3B45; --field:#1E2E37;
  --p1:#F0B457; --p2:#4FB3A8; --btn:#E4EEF1; --btnink:#16232B; --alarm:#E8706A;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  display:flex; align-items:center; justify-content:center;
}
main{width:min(560px,100%);padding:24px;display:flex;flex-direction:column;gap:32px}

.track{display:flex;gap:6px;height:14px}
.seg{position:relative;border-radius:7px;background:var(--track);overflow:hidden;min-width:14px}
.fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0)}
#s1 .fill{background:var(--p1)}#s2 .fill{background:var(--p2)}

.settings{display:flex;gap:6px;margin-top:10px}
.set{display:flex;flex-direction:column;gap:6px;min-width:0}
.set .lbl{font-size:.85rem;font-weight:700}
#set1 .lbl{color:var(--p1)}#set2 .lbl{color:var(--p2)}
.inputs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.inputs input{
  width:3.4em;font:inherit;font-weight:700;font-size:1.05rem;text-align:center;
  padding:6px 4px;border-radius:10px;border:2px solid var(--track);
  background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums;
}
.inputs input:focus-visible{outline:none;border-color:var(--ink)}
.inputs input:disabled{opacity:.55}
.inputs span{font-size:.9rem;color:var(--muted)}

.phase{font-size:1.1rem;font-weight:700;margin:0 0 4px;color:var(--muted);min-height:1.5em}
.phase.on1{color:var(--p1)}.phase.on2{color:var(--p2)}.phase.ring{color:var(--alarm)}
.time{
  font-size:clamp(5rem,26vw,10rem);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:0;
}
.time.ring{color:var(--alarm)}

.controls{display:flex;gap:12px}
button{
  font:inherit;font-weight:700;font-size:1.1rem;border-radius:999px;
  padding:14px 28px;cursor:pointer;border:2px solid var(--btn);
}
#go{background:var(--btn);color:var(--btnink);flex:1}
#go.stop{background:var(--alarm);border-color:var(--alarm);color:#fff}
#reset{background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid var(--p1);outline-offset:3px}
.note{font-size:.85rem;color:var(--muted);margin:0;line-height:1.7}
.unused{background:none;border:none;padding:4px 0;font-size:.9rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

@keyframes pulse{0%,100%{background:var(--bg)}50%{background:color-mix(in srgb,var(--alarm) 35%,var(--bg))}}
body.ringing{animation:pulse .8s ease-in-out infinite}
@keyframes flash{0%{background:color-mix(in srgb,var(--p2) 40%,var(--bg))}100%{background:var(--bg)}}
body.flash{animation:flash 1.2s ease-out}
@media (prefers-reduced-motion:reduce){body.ringing,body.flash{animation:none}}
</style>
</head>
<body>
<main>
  <div>
    <div class="track" aria-hidden="true">
      <div class="seg" id="s1"><div class="fill" id="f1"></div></div>
      <div class="seg" id="s2"><div class="fill" id="f2"></div></div>
    </div>
    <div class="settings">
      <div class="set" id="set1">
        <span class="lbl">1つ目</span>
        <div class="inputs">
          <input id="m1" type="number" inputmode="numeric" min="0" max="999" value="1" aria-label="1つ目の分"><span>分</span>
          <input id="sec1" type="number" inputmode="numeric" min="0" max="59" value="0" aria-label="1つ目の秒"><span>秒</span>
        </div>
      </div>
      <div class="set" id="set2">
        <span class="lbl">2つ目</span>
        <div class="inputs">
          <input id="m2" type="number" inputmode="numeric" min="0" max="999" value="5" aria-label="2つ目の分"><span>分</span>
          <input id="sec2" type="number" inputmode="numeric" min="0" max="59" value="0" aria-label="2つ目の秒"><span>秒</span>
        </div>
      </div>
    </div>
  </div>

  <div>
    <p class="phase" id="phase"></p>
    <p class="time" id="time" role="timer" aria-live="off">1:00</p>
  </div>

  <div class="controls">
    <button id="go">スタート</button>
    <button id="reset">リセット</button>
  </div>
  <p class="note">スタートで「受験生は入室してください」が流れます。1つ目は0になる瞬間に「試験を開始してください」が言い終わるように流れ、そのまま2つ目が始まります。2つ目は0になったら「試験を終了してください」が流れます。時間は止まっているときに変更できます。</p>
</main>

};
let P=[60,300];
let elapsed=0,startAt=null,raf=null,state='idle',lastPhase=0;
const $=id=>document.getElementById(id);
const timeEl=$('time'),phaseEl=$('phase'),go=$('go');
const inputs=['m1','sec1','m2','sec2'].map($);

// ---- 設定の読み込み・保存 ----
try{
  const saved=JSON.parse(localStorage.getItem('twoPhaseTimer')||'null');
  if(saved&&saved.length===2) P=saved;
}catch(e){}
function syncInputs(){
  $('m1').value=Math.floor(P[0]/60); $('sec1').value=P[0]%60;
  $('m2').value=Math.floor(P[1]/60); $('sec2').value=P[1]%60;
}
function readInputs(){
  const v=id=>Math.max(0,Math.floor(Number($(id).value)||0));
  P=[v('m1')*60+Math.min(v('sec1'),59), v('m2')*60+Math.min(v('sec2'),59)];
  try{localStorage.setItem('twoPhaseTimer',JSON.stringify(P));}catch(e){}
  layout(); render();
}
inputs.forEach(i=>{ i.addEventListener('input',readInputs); i.addEventListener('blur',syncInputs); });

function layout(){
  const a=Math.max(P[0],1),b=Math.max(P[1],1);
  $('s1').style.flex=a; $('s2').style.flex=b;
  $('set1').style.flex=a; $('set2').style.flex=b;
  const r=a/(a+b);
  if(r<0.3){$('set1').style.flex='0 0 auto';$('set2').style.flex=1;}
  else if(r>0.7){$('set2').style.flex='0 0 auto';$('set1').style.flex=1;}
}

// ---- 音声（Web Audioで時刻を指定して再生） ----
let ctx=null; const buf={}; let voiceEnd=1.7; let scheduled=[];
function b64ToBuf(s){ const bin=atob(s),a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a.buffer; }
function initAudio(){
  if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  for(const k in AUDIO_SRC){
    ctx.decodeAudioData(b64ToBuf(AUDIO_SRC[k]),d=>{
      buf[k]=d;
      if(k==='start'){ // 声が終わる位置（末尾の無音を除く）を調べる
        const ch=d.getChannelData(0); let i=ch.length-1;
        while(i>0&&Math.abs(ch[i])<0.01) i--;
        voiceEnd=i/d.sampleRate;
      }
      if(state==='running'){ schedule(); if(k==='enter'&&elapsed<1) play('enter',ctx.currentTime); }
    },()=>{});
  }
}
function play(k,when,offset){
  if(!buf[k]) return;
  const src=ctx.createBufferSource(); src.buffer=buf[k];
  const g=ctx.createGain(); g.gain.value=1; src.connect(g).connect(ctx.destination);
  src.start(Math.max(when,ctx.currentTime),offset||0);
  scheduled.push(src);
}
function clearScheduled(){ scheduled.forEach(s=>{try{s.stop();}catch(e){}}); scheduled=[]; }
// 現在の経過時間をもとに、これから鳴らす音を予約し直す
function schedule(){
  if(!ctx) return;
  clearScheduled();
  const now=ctx.currentTime, T=P[0]+P[1];
  // 1つ目：0になる瞬間に声が終わるように
  if(P[0]>0&&elapsed<P[0]){
    const at=P[0]-voiceEnd;          // 経過時間で何秒の時点で流し始めるか
    if(elapsed<=at) play('start',now+(at-elapsed));
    else play('start',now,elapsed-at); // 途中から再開した場合は続きから
  }
  // 2つ目：0になってから
  if(elapsed<T) play('end',now+(T-elapsed));
}

function flash(){
  if(navigator.vibrate) navigator.vibrate([300,100,300]);
  document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
}

// ---- 表示 ----
function fmt(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function label(s){ const m=Math.floor(s/60),x=s%60; return (m?m+'分':'')+(x?x+'秒':'')||'0秒'; }

function render(){
  const T=P[0]+P[1], e=Math.min(elapsed,T), inP1=e<P[0];
  const remain=inP1?P[0]-e:T-e;
  $('f1').style.transform=`scaleX(${P[0]?Math.min(e/P[0],1):1})`;
  $('f2').style.transform=`scaleX(${P[1]?Math.max(0,(e-P[0])/P[1]):(e>=P[0]?1:0)})`;
  timeEl.textContent=fmt(state==='idle'?P[0]:remain);
  phaseEl.className='phase';
  if(state==='idle') phaseEl.textContent=`${label(P[0])} → ${label(P[1])}`;
  else if(state==='done'){ phaseEl.textContent='試験終了'; phaseEl.classList.add('ring'); }
  else{
    phaseEl.textContent=`${inP1?'1つ目':'2つ目'}（${label(inP1?P[0]:P[1])}）`+(state==='paused'?' 一時停止中':'');
    phaseEl.classList.add(inP1?'on1':'on2');
  }
  timeEl.classList.toggle('ring',state==='done');
  inputs.forEach(i=>i.disabled=(state==='running'||state==='paused'));
  document.title=state==='idle'?'試験タイマー':state==='done'?'試験終了':`${fmt(remain)} ${inP1?'1つ目':'2つ目'}`;
}

function tick(){
  const T=P[0]+P[1];
  elapsed=(performance.now()-startAt)/1000;
  const p=elapsed<P[0]?0:1;
  if(p!==lastPhase){ lastPhase=p; if(elapsed<T) flash(); }
  if(elapsed>=T){
    elapsed=T; state='done'; go.textContent='もう一度'; scheduled=[];
    render(); flash(); return;
  }
  render(); raf=requestAnimationFrame(tick);
}

go.addEventListener('click',()=>{
  initAudio();
  if(state==='running'){
    cancelAnimationFrame(raf); state='paused'; go.textContent='再開';
    clearScheduled(); render(); return;
  }
  if(P[0]+P[1]<=0) return;
  const fresh=(state==='done'||state==='idle');
  if(fresh){ elapsed=0; lastPhase=P[0]>0?0:1; }
  startAt=performance.now()-elapsed*1000; state='running'; go.textContent='一時停止';
  schedule();
  if(fresh) play('enter',ctx.currentTime);
  raf=requestAnimationFrame(tick);
});
$('reset').addEventListener('click',()=>{
  cancelAnimationFrame(raf); if(ctx) clearScheduled();
  elapsed=0; lastPhase=0; state='idle'; go.textContent='スタート'; render();
});
document.addEventListener('visibilitychange',()=>{ if(state==='running'&&!document.hidden){ cancelAnimationFrame(raf); tick(); }});
setInterval(()=>{ if(state==='running'&&document.hidden){ cancelAnimationFrame(raf); tick(); }},250);

syncInputs(); layout(); render();
</script>
</body>
